[project]
name = "hitl-skill"
version = "0.1.0"
description = "Claude Code skill for cryptographically verified HITL approval"
requires-python = ">=3.11"
dependencies = [
    "hitl-cli",
    "click>=8.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
hitl-approve = "hitl_skill.skill:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]
