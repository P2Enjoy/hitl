[project]
name = "hitl-mcp"
version = "0.1.0"
description = "FastMCP server exposing HITL verification as MCP tools"
requires-python = ">=3.11"
dependencies = [
    "hitl-sdk @ {path = '../sdk/python'}",
    "fastmcp>=2.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[project.scripts]
hitl-mcp = "hitl_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]
