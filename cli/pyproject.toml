[project]
name = "hitl-cli"
version = "0.1.0"
description = "Demo CLI for the HITL cryptographically signed permission system"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "cryptography>=42.0",
    "pydantic>=2.7",
    "rich>=13.7",
    "python-dotenv>=1.0",
    "redis>=5.0",
    "PyJWT[crypto]>=2.8",
]

[project.scripts]
hitl = "hitl_cli.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
    "respx>=0.21",
    "ruff>=0.4",
    "mypy>=1.10",
]
