[project]
name = "hitl-sdk"
version = "0.1.0"
description = "Cryptographically signed human-in-the-loop permissions — Python SDK"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
keywords = ["hitl", "human-in-the-loop", "ai", "agent", "permissions", "signing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.27",
    "cryptography>=42.0",
    "pydantic>=2.7",
    "redis>=5.0",
    "python-dotenv>=1.0",
    "click>=8.1",
    "rich>=13.7",
    "PyJWT[crypto]>=2.8",
]

[project.scripts]
hitl-setup = "hitl.setup._cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hitl"]

[tool.hatch.build.targets.wheel.shared-data]
"hitl/data" = "hitl/data"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]
