version: "3.9"

services:
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-changeme}
    ports:
      - "8080:8080"
    volumes:
      - ./oauth/realm-export.json:/opt/keycloak/data/import/hitl-realm.json:ro
    networks:
      - hitl-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/realms/hitl/.well-known/openid-configuration || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - hitl-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

networks:
  hitl-net:
    driver: bridge
