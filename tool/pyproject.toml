[project]
name = "hitl-tool"
version = "0.1.0"
description = "Demo tool showing @require_human_approval decorator for HITL"
requires-python = ">=3.11"
dependencies = [
    "hitl-sdk @ {path = '../sdk/python'}",
    "rich>=13.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[project.optional-dependencies]
cli-path = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]
